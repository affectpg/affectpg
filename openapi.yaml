openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Just For Us - Community Forum API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: threads
    description: Forum thread operations
  - name: replies
    description: Reply operations
  - name: categories
    description: Category operations
  - name: stats
    description: Community statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all forum categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /threads:
    get:
      operationId: listThreads
      tags: [threads]
      summary: List forum threads
      parameters:
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thread"
    post:
      operationId: createThread
      tags: [threads]
      summary: Create a new thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadInput"
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"

  /threads/{id}:
    get:
      operationId: getThread
      tags: [threads]
      summary: Get a single thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thread found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        "404":
          description: Not found
    delete:
      operationId: deleteThread
      tags: [threads]
      summary: Delete a thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /threads/{id}/replies:
    get:
      operationId: listReplies
      tags: [replies]
      summary: List replies for a thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reply"
    post:
      operationId: createReply
      tags: [replies]
      summary: Add a reply to a thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reply"

  /stats/overview:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get community overview statistics
      responses:
        "200":
          description: Community stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityStats"

  /threads/recent:
    get:
      operationId: getRecentThreads
      tags: [threads]
      summary: Get recent forum activity
      responses:
        "200":
          description: Recent threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thread"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        color:
          type: string
        threadCount:
          type: integer
      required:
        - id
        - name
        - description
        - color
        - threadCount

    Thread:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        authorName:
          type: string
        isAnonymous:
          type: boolean
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryColor:
          type: string
        replyCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - body
        - authorName
        - isAnonymous
        - categoryId
        - categoryName
        - categoryColor
        - replyCount
        - createdAt
        - updatedAt

    ThreadInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        body:
          type: string
          minLength: 10
        authorName:
          type: string
        isAnonymous:
          type: boolean
        categoryId:
          type: integer
      required:
        - title
        - body
        - authorName
        - isAnonymous
        - categoryId

    Reply:
      type: object
      properties:
        id:
          type: integer
        threadId:
          type: integer
        body:
          type: string
        authorName:
          type: string
        isAnonymous:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - threadId
        - body
        - authorName
        - isAnonymous
        - createdAt

    ReplyInput:
      type: object
      properties:
        body:
          type: string
          minLength: 3
        authorName:
          type: string
        isAnonymous:
          type: boolean
      required:
        - body
        - authorName
        - isAnonymous

    CommunityStats:
      type: object
      properties:
        totalThreads:
          type: integer
        totalReplies:
          type: integer
        totalCategories:
          type: integer
        recentActivity:
          type: integer
      required:
        - totalThreads
        - totalReplies
        - totalCategories
        - recentActivity
